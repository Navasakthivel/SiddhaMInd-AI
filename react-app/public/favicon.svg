<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="SiddhaMind AI">
  <!-- The .sm-brand-mark from siddhamind.css, at favicon size: the same
       140deg gold gradient and the same rounded-square silhouette, so the tab
       matches the mark in the rail rather than being a second logo. -->
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1" gradientTransform="rotate(50 .5 .5)">
      <stop offset="0" stop-color="#d3ad4e"/>
      <stop offset="1" stop-color="#a8831f"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="30" height="30" rx="8" fill="#1b1e40"/>
  <rect x="5" y="5" width="22" height="22" rx="6" fill="url(#gold)"/>
</svg>
