# ============================================================
#  SiddhaMind Core (Java / Spring Boot 3)
#  Persistence: Supabase Postgres. Schema owned by Flyway.
# ============================================================
spring.application.name=siddhamind-core
server.port=8080
server.servlet.context-path=/siddhamind

# ---------- datasource: Supabase TRANSACTION pooler (port 6543) ----------
# The runtime connection. PgBouncer in transaction mode multiplexes many clients
# onto few server connections, which is what a web app wants.
spring.datasource.url=${JAVA_DB_URL:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Transaction-mode pooling does not support server-side prepared statements: a
# statement prepared on one backend is not visible when the next query lands on a
# different one. Both settings below are required, not optional tuning.
spring.datasource.hikari.data-source-properties.prepareThreshold=0
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
# Supabase closes idle pooled connections; recycle before it does.
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.idle-timeout=240000
# Ping idle connections so a dead one is discovered and replaced in the
# background, not by the next user request. Without this, an app left idle for
# ~20 minutes answers its first click only after Hikari has failed validation
# and rebuilt the pool - measured at over 25 seconds, which reads as a freeze.
# Must be shorter than max-lifetime.
spring.datasource.hikari.keepalive-time=120000
# Fail a borrow attempt in 10s rather than the default 30s: a request that
# cannot get a connection should say so while someone is still watching.
spring.datasource.hikari.validation-timeout=5000

# ---------- JPA ----------
# Flyway owns the schema. validate catches drift between entities and migrations
# without ever mutating a cloud database.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.show-sql=false

# ---------- Flyway: DIRECT or SESSION connection, never the transaction pooler ----
# Flyway takes a pg_advisory_lock to serialise migrations. Advisory locks are
# session-scoped, and a transaction pooler hands each statement a different backend,
# so the lock would be taken and dropped on different connections. Migrations must
# run over port 5432 (direct or session pooler).
# The URL is applied by FlywayConfig, which falls back to the runtime DataSource
# (with a warning) when MIGRATION_DB_URL is unset. It is not set here because an
# empty value would be passed through as a literal blank URL.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true

# ---------- seeding ----------
# Never implicit. Enable here, or launch with --seed.
siddhamind.seed.enabled=${SEED_ENABLED:false}
siddhamind.seed.force=${SEED_FORCE:false}

# ---------- Python AI service ----------
# Blank disables every AI call: the HTTP adapters do not register and
# NoOpAiExplanationAdapter takes over, so safety and diagnosis keep working
# exactly as before - the deterministic verdict is the product. Set
# AI_SERVICE_URL= (empty) to force that, e.g. when the AI service is down for
# maintenance and you would rather not wait for timeouts on every page.
siddhamind.ai.base-url=${AI_SERVICE_URL:http://localhost:8000}
siddhamind.ai.internal-token=${INTERNAL_API_TOKEN:}
# Applied to connect AND read. Without an explicit read timeout the JDK default
# is infinite, so an AI service that accepts the connection then hangs would
# block a Tomcat worker forever.
siddhamind.ai.timeout-seconds=${AI_TIMEOUT_SECONDS:60}

# ---------- request/response encoding ----------
# Pins request and response decoding to UTF-8 explicitly. The corpus is Tamil
# and so are the questions practitioners type, so nothing on this path should
# depend on a container default.
#
# These are defensive, not a fix: Spring Boot 3 / Tomcat 10 already decode form
# bodies as UTF-8, and a Tamil question was verified to round-trip correctly
# both with and without force-request. They are here so that a future container
# or servlet-spec default cannot silently change it, since the failure mode is
# invisible on output - the reply comes back in perfect Tamil either way, which
# makes a mangled question look like a model problem rather than a decoding one.
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force-request=true

# ---------- file upload (corpus PDFs) ----------
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=60MB
siddhamind.corpus.dir=${CORPUS_DIR:../corpus}

# ---------- actuator ----------
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# ---------- logging ----------
logging.level.com.siddhamind=INFO
logging.level.org.flywaydb=INFO
